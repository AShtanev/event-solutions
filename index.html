<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Solutions</title>
<meta name="description" content="Interactive installations, live AR graphics, previsualization and stage robotics for events.">
<style>
  :root{
    --bg:#0e0f12; --surface:#16181d; --surface-2:#1d2026; --line:#2a2e37;
    --text:#f2f3f5; --muted:#9aa1ad; --accent:#ffc857; --accent-dim:#8a6d2f;
    --radius:14px; --maxw:1180px;
  }
  :root:not([data-theme="dark"]) [data-force-light]{}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}

  header{padding:56px 0 34px; border-bottom:1px solid var(--line)}
  h1{margin:0 0 10px; font-size:clamp(28px,5.2vw,46px); line-height:1.12; letter-spacing:-.02em; font-weight:650}
  .lede{margin:0; color:var(--muted); font-size:clamp(15px,2.2vw,18px); max-width:62ch}
  .bar{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:26px}
  .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
  .langs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px}
  .langs button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--accent); color:#1b1400}

  section{padding:46px 0 10px; border-bottom:1px solid var(--line)}
  section:last-of-type{border-bottom:0}
  .sec-head{display:flex; gap:16px; align-items:baseline; margin-bottom:6px}
  .num{color:var(--accent-dim); font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; letter-spacing:.08em}
  h2{margin:0; font-size:clamp(21px,3.4vw,28px); letter-spacing:-.015em; font-weight:640}
  .sec-lede{margin:0 0 26px; color:var(--muted); max-width:66ch; font-size:15px}

  .grid{display:grid; gap:26px 22px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  figure{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column}
  .vbox{background:#000; position:relative}
  video{display:block; width:100%; height:auto; background:#000}
  figure.portrait .vbox{display:flex; justify-content:center}
  figure.portrait video{max-height:560px; width:auto; max-width:100%}
  figcaption{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
  .cap-t{font-weight:620; font-size:15.5px; letter-spacing:-.01em}
  .cap-d{color:var(--muted); font-size:14px; margin:0}
  .dur{color:var(--accent-dim); font-size:12px; font-variant-numeric:tabular-nums; letter-spacing:.06em; margin-top:auto; padding-top:4px}

  footer{padding:44px 0 64px; color:var(--muted); font-size:14px}
  footer a{color:var(--accent); text-decoration:none}
  footer a:hover{text-decoration:underline}
  .note{margin-top:10px; font-size:13px; color:#6f7784}

  @media (max-width:560px){
    header{padding:36px 0 26px}
    section{padding:34px 0 6px}
    .grid{gap:20px; grid-template-columns:1fr}
    figure.portrait video{max-height:none; width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="bar">
      <div class="brand" id="brand">Event Solutions</div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <main id="main"></main>

  <footer>
    <p id="foot"></p>
    <p class="note" id="note"></p>
  </footer>

</div>

<script>
const DATA = {
  en: {
    title: "Interactive solutions for events",
    lede: "Installations that a crowd can play without an app, live AR in broadcast, stage previsualization and humanoid robots on stage. Everything below was filmed at real events, on real hardware.",
    foot: "Every clip is production footage from a delivered project. Source masters are available at full resolution on request.",
    note: "Client names are withheld where the work is under NDA; brand marks visible on screen belong to their owners.",
    blocks: [
      {
        t: "Interactive installations and games",
        l: "Hardware and software for an activation zone: a crowd walks up and plays with no app, no signup and no controller.",
        items: [
          { f:"01-media-facade-game", t:"Group game on a media facade", d:"Camera-based motion tracking scores up to 78 players at once on a large LED wall. Guests play with their hands — nothing to install, nothing to hold.", dur:"0:14" },
          { f:"02-racing-terminals", t:"Multiplayer racing on paired terminals", d:"Several touch stations networked into one race with a shared leaderboard. Scales from two seats to a full tournament zone.", dur:"0:25" },
          { f:"03-led-wall-race", t:"Phone-controlled race on an LED wall", d:"A long-format LED wall renders the track; the audience steers from their own phones through a web page, with no app install. Deployed at an international motorsport championship.", dur:"0:15" },
          { f:"04-projection-mapping-rig", t:"Projection mapping on real machinery", d:"Video mapped onto an actual vehicle, driven from an interactive console. Visitors trigger animated cutaways that explain the hydraulics and drivetrain underneath.", dur:"1:13" }
        ]
      },
      {
        t: "Interactive outdoor advertising",
        l: "Street furniture that reacts to a passer-by and drives the big screen above it in real time.",
        items: [
          { f:"05-dooh-kiosk-calculator", t:"Touch kiosk driving a city facade", d:"A passer-by enters their parameters on the kiosk and gets a personal figure; the result is mirrored live onto a large city facade screen. Built for a major bank.", dur:"0:33" },
          { f:"06-dooh-slider-facade", t:"One-gesture street control", d:"A street stand with a single physical slider. One pull switches the creative running on the facade above — deliberately reduced to a gesture anyone can do while walking past.", dur:"0:11" }
        ]
      },
      {
        t: "Live AR graphics in broadcast",
        l: "Real-time 3D composited into a live camera feed — tracked, lit to match and delivered straight to air.",
        items: [
          { f:"07-ar-headpiece", t:"Headpiece tracked to a performer", d:"A 3D headpiece locked to the artist's head through fast movement and profile turns, rendered live into the broadcast feed.", dur:"1:00" },
          { f:"08-ar-particles", t:"AR celestial body and particles", d:"A planet and a drifting particle field composited into the stage in real time, reacting to the performance below.", dur:"0:14" },
          { f:"09-ar-phone", t:"Oversized AR object on stage", d:"A giant phone carrying a live video call, plus dimensional typography built into the set — all rendered in-camera, nothing added in post.", dur:"0:21" }
        ]
      },
      {
        t: "Stage previsualization",
        l: "The whole show built in 3D before load-in, so lighting, scenic and camera are agreed on screen instead of on site.",
        items: [
          { f:"10-previz-control-room", t:"Previz in the control room", d:"Previsualization played back against live camera feeds so the director can match planned looks to what the cameras actually see.", dur:"0:32" },
          { f:"11-previz-stage", t:"Full-venue previsualization", d:"Lighting, lasers, scenic elements and crowd modelled for a large open-air stage, used to lock the design before anything is built.", dur:"0:32" }
        ]
      },
      {
        t: "Robots on stage and in the venue",
        l: "Humanoid robots as part of the programme — performing, hosting and working the room, on our own control software.",
        items: [
          { f:"12-robot-dancer-show", t:"Humanoid and choreographer duet — full show", d:"A humanoid performing a full duet with choreographer Alexander Mogilev at the All-Russian Competition of Ballet Dancers and Choreographers, Yoshkar-Ola.", dur:"5:39" },
          { f:"13-robot-conductor-symphony", t:"Robot conductor — Symphony of Innovations", d:"A humanoid on the conductor's podium for Rosconcert's show Symphony of Innovations.", dur:"0:18" },
          { f:"14-robot-conductor-orchestra", t:"Conducting a live orchestra", d:"The robot conducting a full symphony orchestra in front of a seated hall, Prokofiev's Dance of the Knights.", dur:"0:50" },
          { f:"15-robot-conductor-gala", t:"Gala stage appearance", d:"The humanoid on a large gala stage with a full house — the same platform dressed for a different show.", dur:"0:35" },
          { f:"16-vr-teleoperation", t:"VR teleoperation", d:"An operator in a headset drives the humanoid in real time; arms, hands and head follow the operator at 60 fps. Lets a live host puppeteer the robot from backstage.", dur:"0:44" },
          { f:"17-robot-bartender", t:"Robot bartender", d:"A humanoid working a bar — picking up bottles, pouring and serving guests as a standing attraction.", dur:"1:19" }
        ]
      }
    ]
  },
  ru: {
    title: "Интерактивные решения для мероприятий",
    lede: "Инсталляции, в которые толпа играет без приложения, AR-графика в прямом эфире, превизуализация сцены и гуманоидные роботы в программе. Всё ниже снято на реальных мероприятиях и на реальном оборудовании.",
    foot: "Каждый ролик — съёмка со сданного проекта. Исходники в полном разрешении предоставим по запросу.",
    note: "Названия заказчиков не указаны там, где работа под NDA; товарные знаки в кадре принадлежат их владельцам.",
    blocks: [
      {
        t: "Интерактивные инсталляции и игры",
        l: "Железо и софт для активационной зоны: человек подходит и играет — без приложения, без регистрации, без контроллера в руках.",
        items: [
          { f:"01-media-facade-game", t:"Групповая игра на медиафасаде", d:"Трекинг движения по камере ведёт счёт одновременно для 78 участников на большом LED-экране. Играют руками — ничего не нужно ставить и нечего держать.", dur:"0:14" },
          { f:"02-racing-terminals", t:"Мультиплеерная гонка на терминалах", d:"Несколько тач-станций связаны в одну гонку с общей таблицей результатов. Масштабируется от двух мест до полноценной турнирной зоны.", dur:"0:25" },
          { f:"03-led-wall-race", t:"Гонка на LED-экране с управлением со смартфона", d:"Трасса выводится на длинный LED-экран, зрители рулят со своих телефонов через веб-страницу — ставить приложение не нужно. Реализовано на международном автоспортивном чемпионате.", dur:"0:15" },
          { f:"04-projection-mapping-rig", t:"Проекционный мэппинг на технику", d:"Видео ложится на реальную машину, управление — с интерактивного пульта. Посетитель запускает анимированные разрезы, которые показывают гидравлику и трансмиссию внутри.", dur:"1:13" }
        ]
      },
      {
        t: "Интерактивная наружная реклама",
        l: "Уличный объект, который реагирует на прохожего и в реальном времени управляет большим экраном над ним.",
        items: [
          { f:"05-dooh-kiosk-calculator", t:"Тач-киоск, управляющий городским фасадом", d:"Прохожий вводит свои параметры на киоске и получает персональную цифру; результат тут же выводится на большой городской медиафасад. Сделано для крупного банка.", dur:"0:33" },
          { f:"06-dooh-slider-facade", t:"Управление одним жестом", d:"Уличная стойка с единственным физическим слайдером. Одно движение переключает креатив на фасаде выше — намеренно сведено к жесту, который можно сделать на ходу.", dur:"0:11" }
        ]
      },
      {
        t: "AR-графика в прямом эфире",
        l: "Трёхмерная графика в реальном времени поверх живой камеры — с трекингом, согласованным светом и выдачей сразу в эфир.",
        items: [
          { f:"07-ar-headpiece", t:"Головной убор с трекингом на артисте", d:"3D-объект держится на голове артиста при быстрых движениях и поворотах в профиль, рендерится живьём в эфирный сигнал.", dur:"1:00" },
          { f:"08-ar-particles", t:"AR-планета и частицы", d:"Небесное тело и поле частиц вживую вкомпонованы в сцену и реагируют на происходящее на площадке.", dur:"0:14" },
          { f:"09-ar-phone", t:"Крупный AR-объект на сцене", d:"Гигантский телефон с живым видеозвонком и объёмная типографика, встроенные в декорацию. Всё считается в камеру, на постобработке ничего не дорисовано.", dur:"0:21" }
        ]
      },
      {
        t: "Превизуализация сцены",
        l: "Шоу целиком собрано в 3D до монтажа, чтобы свет, декорации и камеры согласовывались на экране, а не на площадке.",
        items: [
          { f:"10-previz-control-room", t:"Превиз в режиссёрской", d:"Превизуализация проигрывается рядом с живыми камерами — режиссёр сверяет задуманные планы с тем, что реально видят камеры.", dur:"0:32" },
          { f:"11-previz-stage", t:"Превиз площадки целиком", d:"Свет, лазеры, декорации и зрители смоделированы для большой открытой сцены. Используется, чтобы утвердить оформление до того, как что-либо построено.", dur:"0:32" }
        ]
      },
      {
        t: "Роботы на сцене и в зале",
        l: "Гуманоидные роботы как часть программы — выступают, ведут и работают с гостями. На нашем собственном управляющем софте.",
        items: [
          { f:"12-robot-dancer-show", t:"Дуэт гуманоида и хореографа — полное шоу", d:"Гуманоид исполняет полноценный дуэт с хореографом Александром Могилёвым на Всероссийском конкурсе артистов балета и хореографов в Йошкар-Оле.", dur:"5:39" },
          { f:"13-robot-conductor-symphony", t:"Робот-дирижёр — «Симфония инноваций»", d:"Гуманоид за дирижёрским пультом в шоу Росконцерта «Симфония инноваций».", dur:"0:18" },
          { f:"14-robot-conductor-orchestra", t:"Дирижирование живым оркестром", d:"Робот дирижирует симфоническим оркестром перед полным залом — «Танец рыцарей» Прокофьева.", dur:"0:50" },
          { f:"15-robot-conductor-gala", t:"Выход на гала-сцене", d:"Гуманоид на большой гала-сцене при полном зале — та же платформа в оформлении другого шоу.", dur:"0:35" },
          { f:"16-vr-teleoperation", t:"Телеоперация через VR", d:"Оператор в шлеме управляет гуманоидом в реальном времени: руки, кисти и голова повторяют движения с частотой 60 кадров в секунду. Позволяет ведущему «оживлять» робота из-за кулис.", dur:"0:44" },
          { f:"17-robot-bartender", t:"Робот-бармен", d:"Гуманоид работает за барной стойкой — берёт бутылки, наливает и подаёт гостям. Формат постоянно действующей активности.", dur:"1:19" }
        ]
      }
    ]
  }
};

const PORTRAIT = new Set(["05-dooh-kiosk-calculator","06-dooh-slider-facade","13-robot-conductor-symphony","14-robot-conductor-orchestra","15-robot-conductor-gala","16-vr-teleoperation"]);

function render(lang){
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = d.title;
  document.getElementById("lede").textContent  = d.lede;
  document.getElementById("foot").textContent  = d.foot;
  document.getElementById("note").textContent  = d.note;

  const main = document.getElementById("main");
  main.textContent = "";
  d.blocks.forEach((b, bi) => {
    const sec = document.createElement("section");
    const head = document.createElement("div"); head.className = "sec-head";
    const num = document.createElement("span"); num.className = "num";
    num.textContent = String(bi + 1).padStart(2, "0");
    const h2 = document.createElement("h2"); h2.textContent = b.t;
    head.append(num, h2);
    const lede = document.createElement("p"); lede.className = "sec-lede"; lede.textContent = b.l;
    const grid = document.createElement("div"); grid.className = "grid";

    b.items.forEach(it => {
      const fig = document.createElement("figure");
      if (PORTRAIT.has(it.f)) fig.classList.add("portrait");
      const box = document.createElement("div"); box.className = "vbox";
      const v = document.createElement("video");
      v.controls = true; v.preload = "none"; v.playsInline = true;
      v.poster = `posters/${it.f}.jpg`;
      v.src = `videos/${it.f}.mp4`;
      box.append(v);
      const cap = document.createElement("figcaption");
      const t = document.createElement("div"); t.className = "cap-t"; t.textContent = it.t;
      const p = document.createElement("p"); p.className = "cap-d"; p.textContent = it.d;
      const du = document.createElement("div"); du.className = "dur"; du.textContent = it.dur;
      cap.append(t, p, du);
      fig.append(box, cap);
      grid.append(fig);
    });

    sec.append(head, lede, grid);
    main.append(sec);
  });
}

document.querySelectorAll(".langs button").forEach(btn => {
  btn.addEventListener("click", () => {
    const lang = btn.dataset.lang;
    document.querySelectorAll(".langs button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    render(lang);
    try { localStorage.setItem("es-lang", lang); } catch (e) {}
  });
});

let start = "en";
try { const s = localStorage.getItem("es-lang"); if (s === "ru" || s === "en") start = s; } catch (e) {}
if (start === "ru") {
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === "ru")));
}
render(start);
</script>
</body>
</html>
